<div class="gb-composer">
  <form id="gb-form" class="gb-form">
    <label>Message
      <textarea name="message" required maxlength="160" rows="4" placeholder="say hi..."></textarea>
      <span class="gb-count" id="gb-count">0/160</span>
    </label>
    <label>Your name
      <input name="name" required maxlength="40">
    </label>
    <label>Style
      <select name="style">
        <option value="plain">plain</option>
        <option value="pink">pink</option>
        <option value="terminal">terminal</option>
        <option value="ocean">ocean</option>
        <option value="lavender">lavender</option>
        <option value="paper">paper</option>
        <option value="matcha">matcha</option>
        <option value="sticky">sticky note</option>
        <option value="postcard">postcard</option>
        <option value="win95">win95</option>
        <option value="newsprint">newsprint</option>
        <option value="blueprint">blueprint</option>
        <option value="gameboy">game boy</option>
        <option value="polaroid">polaroid</option>
        <option value="receipt">receipt</option>
        <option value="chalkboard">chalkboard</option>
        <option value="mixtape">mixtape</option>
      </select>
    </label>
    <input name="website" class="gb-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit">Sign the guestbook</button>
    <p id="gb-status" role="status"></p>
  </form>

  <div class="gb-preview-pane">
    <p class="gb-preview-label">preview</p>
    <ol class="gb-entries gb-preview-list" id="gb-preview" aria-hidden="true"></ol>
  </div>
</div>

<ol id="gb-entries" class="gb-entries"></ol>
<nav id="gb-pager" class="gb-pager" aria-label="guestbook pages"></nav>

<script>
  (() => {
    const API = "https://guestbook.talha-yildirim720.workers.dev";
    const form = document.getElementById("gb-form");
    const list = document.getElementById("gb-entries");
    const status = document.getElementById("gb-status");
    const preview = document.getElementById("gb-preview");
    const pager = document.getElementById("gb-pager");
    let token = null;

    function entryNode(e) {
      const li = document.createElement("li");
      li.className = "gb-entry gb-style-" + e.style;

      const msg = document.createElement("p");
      msg.className = "gb-message";
      msg.textContent = e.message;

      const who = document.createElement("span");
      who.textContent = e.name;

      const when = document.createElement("time");
      when.dateTime = e.created_at;
      when.textContent = new Date(e.created_at).toLocaleDateString();

      const meta = document.createElement("footer");
      meta.className = "gb-meta";
      meta.append("— ", who, " · ", when);

      li.append(msg, meta);
      return li;
    }

    function renderPreview() {
      const data = Object.fromEntries(new FormData(form));
      document.getElementById("gb-count").textContent = data.message.length + "/160";
      preview.replaceChildren(
        entryNode({
          name: data.name.trim() || "your name",
          message: data.message.trim() || "your message...",
          style: data.style,
          created_at: new Date().toISOString(),
        })
      );
    }

    function renderPager(total, page, perPage) {
      const pages = Math.ceil(total / perPage);
      pager.replaceChildren();
      if (pages <= 1) return;

      const btn = (label, target, disabled) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        b.disabled = disabled;
        b.addEventListener("click", () => load(target));
        return b;
      };

      const info = document.createElement("span");
      info.textContent = "page " + page + " of " + pages;

      pager.append(
        btn("← newer", page - 1, page <= 1),
        info,
        btn("older →", page + 1, page >= pages)
      );
    }

    async function load(page = 1) {
      try {
        const res = await fetch(API + "?page=" + page);
        const data = await res.json();
        token = data.token || token;
        list.replaceChildren(...data.entries.map(entryNode));
        renderPager(data.total, data.page, data.perPage);
      } catch {
        status.textContent = "couldn't load entries";
      }
    }

    form.addEventListener("input", renderPreview);

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      status.textContent = "…";
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...Object.fromEntries(new FormData(form)), token }),
      }).catch(() => null);
      if (res && res.ok) {
        form.reset();
        renderPreview();
        status.textContent = "thanks for signing!";
        load(1);
      } else {
        const err = res ? await res.json().catch(() => ({})) : {};
        status.textContent = err.error || "something went wrong";
      }
    });

    renderPreview();
    load();
  })();
</script>
